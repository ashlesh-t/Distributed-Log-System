name: CI

on:
  push:
    branches: ["main", "development", "feature/**"]
  pull_request:
    branches: ["main", "development"]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.20 black==26.5.1 pylint
      - run: ruff check .
      - run: black --check .

  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - run: bandit -r . -ll --exclude ".venv,k8s,__pycache__" -f json -o bandit-report.json || true
      - run: bandit -r . -ll --exclude ".venv,k8s,__pycache__"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api_gateway/requirements.txt -r heartbeat_service/requirements.txt pytest pytest-asyncio
      - run: pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: |
          docker build -f services/inventory/Dockerfile -t dls/inventory:ci .
          docker build -f services/order/Dockerfile -t dls/order:ci .
          docker build -f services/payment/Dockerfile -t dls/payment:ci .
          docker build -f services/shipping/Dockerfile -t dls/shipping:ci .
          docker build -f log_pipeline/Dockerfile -t dls/log-pipeline:ci .
          docker build -f heartbeat_service/Dockerfile -t dls/heartbeat:ci .
          docker build -f api_gateway/Dockerfile -t dls/api-gateway:ci .
          docker build -f nginx/Dockerfile -t dls/nginx:ci .
          docker build -f Dockerfile.demo -t dls/demo:ci .
