worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Rate limiting zones ────────────────────────────────────────────────────
    limit_req_zone $http_x_api_key zone=api_key_zone:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=ip_zone:10m rate=30r/m;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream api_gateway {
        server api_gateway:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # ── Health check (no rate limit, no auth) ─────────────────────────────
        location = /health {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
        }

        # ── API docs (no rate limit) ───────────────────────────────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
        }

        # ── Admin endpoints — restricted to localhost / internal ───────────────
        location /admin/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── All other API requests ─────────────────────────────────────────────
        location / {
            limit_req zone=api_key_zone burst=20 nodelay;
            limit_req zone=ip_zone burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
