<source>
  @type forward
  port 9880
  bind 0.0.0.0
</source>

# Health check endpoint for Docker healthcheck
<source>
  @type monitor_agent
  bind 0.0.0.0
  port 24220
</source>

# 1. Parse nested JSON log from Docker's stdout wrapper if present
<filter docker.**>
  @type parser
  key_name log
  reserve_data true
  hash_value_field parsed_log
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# 2. Promote parsed log keys to root level if they exist
<filter docker.**>
  @type record_transformer
  enable_ruby true
  <record>
    node_id ${record["parsed_log"] ? record["parsed_log"]["node_id"] : record["node_id"]}
    service_name ${record["parsed_log"] ? record["parsed_log"]["service_name"] : record["service_name"]}
    message_type ${record["parsed_log"] ? record["parsed_log"]["message_type"] : record["message_type"]}
    status ${record["parsed_log"] ? record["parsed_log"]["status"] : record["status"]}
    log_level ${record["parsed_log"] ? record["parsed_log"]["log_level"] : record["log_level"]}
    message ${record["parsed_log"] ? record["parsed_log"]["message"] : record["message"]}
    timestamp ${record["parsed_log"] ? record["parsed_log"]["timestamp"] : record["timestamp"]}
    error_details ${record["parsed_log"] ? record["parsed_log"]["error_details"] : record["error_details"]}
    response_time_ms ${record["parsed_log"] ? record["parsed_log"]["response_time_ms"] : record["response_time_ms"]}
  </record>
</filter>

# 3. Rewrite tags dynamically based on message_type field
# Scoped to docker.** (the original container tag prefix) rather than **, since
# ** would also match the logs.topic/heartbeat.topic tags this filter emits,
# causing it to re-catch its own output and silently self-consume every record
# (tag rewritten to itself is a no-op) before it ever reaches the kafka2 matches below.
<match docker.**>
  @type rewrite_tag_filter
  <rule>
    key message_type
    pattern /^HEARTBEAT$/
    tag heartbeat.topic
  </rule>
  <rule>
    key message_type
    pattern /^(LOG|REGISTRATION|CLOSE_LOG)$/
    tag logs.topic
  </rule>
  # Fallback for other tags or standard stdout that isn't formatted
  <rule>
    key message_type
    pattern /.*/
    tag logs.topic
  </rule>
</match>

# 4. Route logs.topic tag to Kafka "logs" topic
<match logs.topic>
  @type kafka2
  brokers kafka:9092
  default_topic logs

  <format>
    @type json
  </format>

  <buffer>
    @type memory
    chunk_limit_size 2M
    total_limit_size 8M
    flush_interval 1s
    retry_max_times 5
    retry_type exponential_backoff
  </buffer>
</match>

# 5. Route heartbeat.topic tag to Kafka "heartbeat" topic
<match heartbeat.topic>
  @type kafka2
  brokers kafka:9092
  default_topic heartbeat

  <format>
    @type json
  </format>

  <buffer>
    @type memory
    chunk_limit_size 2M
    total_limit_size 8M
    flush_interval 1s
    retry_max_times 5
    retry_type exponential_backoff
  </buffer>
</match>
