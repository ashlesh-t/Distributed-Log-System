apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: distributed-logs
data:
  fluent.conf: |
    <source>
      @type forward
      port 9880
      bind 0.0.0.0
    </source>
    <source>
      @type monitor_agent
      bind 0.0.0.0
      port 24220
    </source>
    <match fluentd.**.logs>
      @type kafka2
      brokers kafka:9092
      default_topic logs
      <format>
        @type json
      </format>
      <buffer>
        @type memory
        chunk_limit_size 2M
        total_limit_size 8M
        flush_interval 1s
      </buffer>
    </match>
    <match fluentd.**.heartbeat>
      @type kafka2
      brokers kafka:9092
      default_topic heartbeat
      <format>
        @type json
      </format>
      <buffer>
        @type memory
        chunk_limit_size 2M
        total_limit_size 8M
        flush_interval 1s
      </buffer>
    </match>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluentd
  namespace: distributed-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.16-debian-kafka2-1
          ports:
            - containerPort: 9880
            - containerPort: 24220
          volumeMounts:
            - name: config
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: fluentd-config
---
apiVersion: v1
kind: Service
metadata:
  name: fluentd
  namespace: distributed-logs
spec:
  selector:
    app: fluentd
  ports:
    - name: forward
      port: 9880
    - name: monitor
      port: 24220
