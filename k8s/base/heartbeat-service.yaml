apiVersion: v1
kind: ServiceAccount
metadata:
  name: heartbeat-service
  namespace: distributed-logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heartbeat-restarter
  namespace: distributed-logs
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heartbeat-restarter-binding
  namespace: distributed-logs
subjects:
  - kind: ServiceAccount
    name: heartbeat-service
    namespace: distributed-logs
roleRef:
  kind: Role
  name: heartbeat-restarter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat-service
  namespace: distributed-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heartbeat-service
  template:
    metadata:
      labels:
        app: heartbeat-service
    spec:
      serviceAccountName: heartbeat-service
      containers:
        - name: heartbeat-service
          image: dls/heartbeat-service:latest
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: ELASTICSEARCH_HOST
              value: http://elasticsearch:9200
            - name: RESTART_BACKEND
              value: kubernetes
            - name: K8S_NAMESPACE
              value: distributed-logs
            - name: HEARTBEAT_TIMEOUT_SECONDS
              value: "15"
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: dls-secrets
                  key: WEBHOOK_URL
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
