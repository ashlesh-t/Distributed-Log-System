apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: distributed-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: dls/inventory-service:latest
          env:
            - name: SERVICE_NAME
              value: Inventory_Service
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
