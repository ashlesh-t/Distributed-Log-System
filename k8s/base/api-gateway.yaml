apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: distributed-logs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: dls/api-gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: ELASTICSEARCH_HOST
              value: http://elasticsearch:9200
            - name: API_KEY_SALT
              valueFrom:
                secretKeyRef:
                  name: dls-secrets
                  key: API_KEY_SALT
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: dls-secrets
                  key: ADMIN_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: distributed-logs
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: distributed-logs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
