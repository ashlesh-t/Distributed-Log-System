x-service-common: &service-common
  restart: unless-stopped
  env_file:
    - path: .env
      required: false

x-logging-fluentd: &logging-fluentd
  logging:
    driver: fluentd
    options:
      fluentd-address: "localhost:9880"
      fluentd-async: "true"
      tag: "docker.{{.Name}}"

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  zookeeper:
    <<: *service-common
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    # Persist ZooKeeper state alongside kafka_data. Kafka stores the cluster ID
    # in both places; if only Kafka's survives a recreate, the broker refuses to
    # start (InconsistentClusterIdException).
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    <<: *service-common
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  elasticsearch:
    <<: *service-common
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    <<: *service-common
    image: docker.elastic.co/kibana/kibana:8.13.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"

  fluentd:
    <<: *service-common
    image: fluent/fluentd-kubernetes-daemonset:v1.16-debian-kafka2-1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./fluentd/fluentd.conf:/fluentd/etc/fluent.conf:ro
    ports:
      - "9880:9880"
      - "24220:24220"
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-ruri", "-e", "exit(Net::HTTP.get_response(URI('http://localhost:24220/api/plugins.json')).code == '200' ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Core Pipeline ─────────────────────────────────────────────────────────

  log_pipeline:
    <<: *service-common
    build:
      context: .
      dockerfile: log_pipeline/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_HOST: http://elasticsearch:9200

  heartbeat_service:
    <<: *service-common
    build:
      context: .
      dockerfile: heartbeat_service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      RESTART_BACKEND: docker
      HEARTBEAT_TIMEOUT_SECONDS: "15"
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
      WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-false}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-change-me-in-production}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ─── API Gateway ───────────────────────────────────────────────────────────

  api_gateway:
    <<: *service-common
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      API_KEY_SALT: ${API_KEY_SALT:-change-me-in-production}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-in-production}
      WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
      WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-false}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-change-me-in-production}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    <<: *service-common
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      api_gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"

  # ─── Microservices ─────────────────────────────────────────────────────────

  inventory_service:
    <<: [*service-common, *logging-fluentd]
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    depends_on:
      fluentd:
        condition: service_healthy
    environment:
      SERVICE_NAME: Inventory_Service

  order_service:
    <<: [*service-common, *logging-fluentd]
    build:
      context: .
      dockerfile: services/order/Dockerfile
    depends_on:
      fluentd:
        condition: service_healthy
    environment:
      SERVICE_NAME: Order_Service

  payment_service:
    <<: [*service-common, *logging-fluentd]
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    depends_on:
      fluentd:
        condition: service_healthy
    environment:
      SERVICE_NAME: Payment_Service

  shipping_service:
    <<: [*service-common, *logging-fluentd]
    build:
      context: .
      dockerfile: services/shipping/Dockerfile
    depends_on:
      fluentd:
        condition: service_healthy
    environment:
      SERVICE_NAME: Shipping_Service

  # ─── Demo (optional ─── run with: docker compose --profile demo up) ───────────

  demo:
    <<: *service-common
    build:
      context: .
      dockerfile: Dockerfile.demo
    depends_on:
      api_gateway:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api_gateway:8000
    ports:
      - "8501:8501"
    profiles:
      - demo

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  es_data:
